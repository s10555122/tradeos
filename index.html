<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRADE OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#08090c;
    --bg2:#0d0f13;
    --panel:rgba(25,28,34,.78);
    --panel2:rgba(31,35,42,.72);
    --line:rgba(255,255,255,.08);
    --text:#f5f5f7;
    --muted:#8e939d;
    --green:#34d399;
    --red:#ff5f57;
    --blue:#60a5fa;
    --yellow:#fbbf24;
    --purple:#a78bfa;
    --shadow:0 25px 80px rgba(0,0,0,.45);
}

html,body{
    min-height:100%;
    background:
        radial-gradient(circle at 15% 15%,rgba(96,165,250,.10),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(167,139,250,.08),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(52,211,153,.06),transparent 35%),
        #08090c;
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    display:flex;
    min-height:100vh;
}

/* =========================
   BACKGROUND
========================= */

.bg-orb{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(100px);
    pointer-events:none;
    opacity:.14;
    z-index:0;
}

.orb1{
    background:#3b82f6;
    top:-180px;
    left:15%;
}

.orb2{
    background:#8b5cf6;
    right:-180px;
    top:25%;
}

.orb3{
    background:#10b981;
    bottom:-220px;
    left:30%;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:250px;
    padding:22px 16px;
    border-right:1px solid var(--line);
    background:rgba(10,11,14,.72);
    backdrop-filter:blur(28px);
    position:fixed;
    top:0;
    bottom:0;
    z-index:20;
}

.logo{
    padding:10px 12px 28px;
}

.logo-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.8px;
}

.logo-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:5px;
    letter-spacing:1.5px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.nav-btn{
    width:100%;
    text-align:left;
    color:#969aa3;
    background:transparent;
    padding:13px 14px;
    border-radius:13px;
    transition:.25s;
}

.nav-btn:hover{
    background:rgba(255,255,255,.055);
    color:white;
}

.nav-btn.active{
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.055)
    );
    color:white;
    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 8px 25px rgba(0,0,0,.15);
}

.nav-label{
    font-size:13px;
}

.nav-group{
    margin-top:24px;
    margin-bottom:8px;
    padding-left:12px;
    color:#555b66;
    font-size:10px;
    letter-spacing:1.5px;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:30px 34px 80px;
    position:relative;
    z-index:2;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.page-title{
    font-size:30px;
    font-weight:750;
    letter-spacing:-1.2px;
}

.page-sub{
    color:var(--muted);
    margin-top:5px;
    font-size:13px;
}

.top-actions{
    display:flex;
    gap:10px;
}

/* =========================
   BUTTON
========================= */

.btn{
    border-radius:12px;
    padding:10px 15px;
    color:white;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
    transition:.25s;
}

.btn:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.btn.primary{
    background:linear-gradient(135deg,#fff,#d9dce1);
    color:#08090c;
    font-weight:700;
}

.btn.danger{
    color:#ff7770;
    background:rgba(255,95,87,.08);
}

.btn.small{
    padding:7px 10px;
    font-size:12px;
}

/* =========================
   PANELS
========================= */

.panel{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    border:1px solid rgba(255,255,255,.075);
    border-radius:22px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.06);
    backdrop-filter:blur(25px);
}

.panel-pad{
    padding:22px;
}

.grid{
    display:grid;
    gap:16px;
}

.grid-4{
    grid-template-columns:repeat(4,1fr);
}

.grid-3{
    grid-template-columns:repeat(3,1fr);
}

.grid-2{
    grid-template-columns:repeat(2,1fr);
}

.stat{
    padding:20px;
    min-height:130px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
}

.stat-value{
    font-size:29px;
    font-weight:750;
    margin-top:16px;
    letter-spacing:-1px;
}

.stat-small{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
}

/* =========================
   SECTION
========================= */

.section{
    margin-top:25px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.section-title{
    font-size:17px;
    font-weight:700;
}

.section-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* =========================
   STRATEGY CARD
========================= */

.strategy-card{
    position:relative;
    overflow:hidden;
    padding:24px;
    min-height:210px;
    transition:.3s;
    cursor:pointer;
}

.strategy-card:hover{
    transform:translateY(-5px) scale(1.005);
    border-color:rgba(255,255,255,.15);
    box-shadow:0 30px 80px rgba(0,0,0,.38);
}

.strategy-card::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(96,165,250,.12);
    filter:blur(55px);
    right:-70px;
    top:-70px;
}

.strategy-name{
    font-size:19px;
    font-weight:750;
}

.strategy-desc{
    font-size:12px;
    color:var(--muted);
    margin-top:7px;
}

.strategy-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:30px;
}

.mini-stat{
    padding:10px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
}

.mini-label{
    color:#747a84;
    font-size:10px;
}

.mini-value{
    font-size:15px;
    margin-top:4px;
    font-weight:650;
}

.strategy-actions{
    position:absolute;
    right:18px;
    bottom:18px;
    display:flex;
    gap:6px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    color:#737984;
    font-size:11px;
    font-weight:500;
    padding:12px;
    border-bottom:1px solid var(--line);
}

td{
    padding:14px 12px;
    border-bottom:1px solid rgba(255,255,255,.045);
    font-size:12px;
}

tr:hover td{
    background:rgba(255,255,255,.025);
}

.green{
    color:var(--green);
}

.red{
    color:var(--red);
}

.yellow{
    color:var(--yellow);
}

/* =========================
   EQUITY CURVE
========================= */

.chart-panel{
    padding:22px;
}

.chart{
    width:100%;
    height:300px;
    position:relative;
    margin-top:15px;
}

.chart svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.chart-grid{
    stroke:rgba(255,255,255,.06);
    stroke-width:1;
}

.equity-line{
    fill:none;
    stroke:#60a5fa;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 7px rgba(96,165,250,.35));
}

.equity-area{
    fill:url(#equityGradient);
}

.chart-empty{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#666c75;
    font-size:13px;
}

/* =========================
   ALERT
========================= */

.alert{
    border-radius:16px;
    padding:15px 17px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    margin-top:12px;
}

.alert-title{
    font-weight:700;
    font-size:13px;
}

.alert-text{
    color:#9a9fa8;
    font-size:12px;
    margin-top:4px;
    line-height:1.6;
}

.alert.red-alert{
    background:rgba(255,95,87,.08);
    border:1px solid rgba(255,95,87,.18);
}

.alert.yellow-alert{
    background:rgba(251,191,36,.07);
    border:1px solid rgba(251,191,36,.17);
}

.alert.green-alert{
    background:rgba(52,211,153,.07);
    border:1px solid rgba(52,211,153,.17);
}

/* =========================
   GOALS
========================= */

.goal-card{
    position:relative;
    min-height:290px;
    padding:22px;
    overflow:hidden;
    transition:.35s;
}

.goal-card:hover{
    transform:perspective(1000px) rotateX(2deg) rotateY(-2deg) translateY(-4px);
}

.goal-glow{
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    right:-100px;
    bottom:-110px;
    background:rgba(96,165,250,.12);
    filter:blur(45px);
}

.goal-type{
    color:#747a84;
    font-size:10px;
    letter-spacing:1.4px;
}

.goal-name{
    font-size:21px;
    font-weight:750;
    margin-top:8px;
}

.goal-price{
    font-size:14px;
    color:#aeb3bb;
    margin-top:6px;
}

.progress{
    margin-top:25px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#858a94;
}

.progress-track{
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    overflow:hidden;
    margin-top:9px;
}

.progress-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#60a5fa,#a78bfa);
    box-shadow:0 0 18px rgba(96,165,250,.35);
}

.goal-image{
    position:absolute;
    inset:0;
    z-index:-2;
    margin:0;
    border-radius:22px;
    overflow:hidden;
    background:
        radial-gradient(circle at 70% 25%,rgba(167,139,250,.28),transparent 32%),
        linear-gradient(145deg,#16191f,#0d0f13);
}
.goal-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(90deg,rgba(7,9,13,.96) 0%,rgba(7,9,13,.72) 38%,rgba(7,9,13,.30) 72%,rgba(7,9,13,.58) 100%),
        linear-gradient(0deg,rgba(7,9,13,.72),transparent 55%);
}
.goal-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    transform:scale(1.035);
    transition:transform .8s cubic-bezier(.2,.8,.2,1);
    filter:saturate(.9) contrast(1.04);
}
.goal-card:hover .goal-image img{
    transform:scale(1.09);
}
.goal-card.has-image .goal-type,
.goal-card.has-image .goal-name,
.goal-card.has-image .goal-price,
.goal-card.has-image .progress,
.goal-card.has-image > div:last-of-type{
    position:relative;
    z-index:2;
}
.goal-card.has-image .goal-type{color:rgba(255,255,255,.62)}
.goal-card.has-image .goal-price{color:rgba(255,255,255,.72)}
.goal-card.has-image .progress-head{color:rgba(255,255,255,.68)}
.goal-card.has-image .goal-glow{z-index:-1}

.category-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
.category-tab{
    padding:9px 13px;
    border-radius:999px;
    color:#858b95;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
    cursor:pointer;
    transition:.2s;
    font-size:12px;
}
.category-tab:hover,.category-tab.active{
    color:white;
    background:rgba(255,255,255,.105);
    border-color:rgba(255,255,255,.15);
}
.category-badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    font-size:10px;
    color:#cdd1d8;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    margin-top:8px;
}

.goal-placeholder{
    font-size:42px;
    opacity:.7;
}

.goal-actions{
    position:absolute;
    right:18px;
    top:18px;
    display:flex;
    gap:5px;
}

/* =========================
   INVESTMENTS
========================= */

.invest-card{
    padding:20px;
}

.invest-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.invest-name{
    font-size:16px;
    font-weight:700;
}

.invest-symbol{
    font-size:11px;
    color:#737984;
    margin-top:4px;
}

.invest-value{
    font-size:25px;
    font-weight:750;
    margin-top:20px;
}

.invest-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.invest-mini{
    background:rgba(255,255,255,.04);
    border-radius:12px;
    padding:10px;
}

.invest-mini span{
    display:block;
    color:#707680;
    font-size:10px;
}

.invest-mini strong{
    display:block;
    margin-top:5px;
    font-size:13px;
}

/* =========================
   CALENDAR
========================= */

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.calendar-head{
    color:#666c76;
    text-align:center;
    font-size:10px;
    padding:7px;
}

.day{
    min-height:75px;
    border-radius:13px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.045);
    padding:9px;
}

.day.empty{
    opacity:.2;
}
.day.today{
    border-color:rgba(99,207,255,.65);
    box-shadow:0 0 0 1px rgba(99,207,255,.12), inset 0 0 18px rgba(99,207,255,.05);
}

.day-num{
    color:#8b9099;
    font-size:10px;
}

.day-pnl{
    margin-top:20px;
    font-size:12px;
    font-weight:650;
}

/* =========================
   FORM / MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(12px);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(620px,100%);
    max-height:90vh;
    overflow:auto;
    padding:25px;
    border-radius:24px;
    background:
        linear-gradient(
            145deg,
            rgba(35,39,47,.96),
            rgba(17,19,24,.97)
        );
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 40px 100px rgba(0,0,0,.65);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    font-size:19px;
    font-weight:750;
}

.close{
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    color:#aaa;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#8b9099;
    font-size:11px;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:white;
    padding:11px 12px;
    border-radius:11px;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus{
    border-color:rgba(96,165,250,.55);
    box-shadow:0 0 0 3px rgba(96,165,250,.08);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

/* =========================
   CUSTOM SELECT
========================= */

.custom-select{
    position:relative;
}

.select-button{
    width:100%;
    padding:11px 12px;
    border-radius:11px;
    color:white;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.select-menu{
    position:absolute;
    top:calc(100% + 7px);
    left:0;
    right:0;
    background:#1b1e24;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    padding:6px;
    z-index:200;
    display:none;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
}

.custom-select.open .select-menu{
    display:block;
}

.select-option{
    padding:10px;
    border-radius:9px;
    font-size:12px;
    cursor:pointer;
}

.select-option:hover{
    background:rgba(255,255,255,.08);
}

/* =========================
   CONFIRM DELETE MODAL
========================= */
.delete-confirm-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(14px);
    z-index:400;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.delete-confirm-bg.show{display:flex;}
.delete-confirm{
    width:min(390px,100%);
    padding:24px;
    border-radius:20px;
    background:linear-gradient(145deg,rgba(35,39,47,.98),rgba(17,19,24,.99));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 35px 90px rgba(0,0,0,.65);
}
.delete-confirm-title{font-size:18px;font-weight:750;}
.delete-confirm-text{margin-top:9px;color:#999fa9;font-size:13px;line-height:1.6;}
.delete-confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    z-index:300;
    padding:13px 17px;
    border-radius:14px;
    background:#1d2026;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    transform:translateY(30px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    font-size:12px;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================
   COVER
========================= */

.cover{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,rgba(96,165,250,.11),transparent 30%),
        #08090c;
    transition:.8s;
}

.cover.hide{
    opacity:0;
    pointer-events:none;
    transform:scale(1.03);
}

.cover-inner{
    text-align:center;
}

.cover-title{
    font-size:clamp(60px,9vw,130px);
    font-weight:850;
    letter-spacing:-7px;
    line-height:.9;
}

.cover-sub{
    margin-top:20px;
    color:#747a85;
    letter-spacing:4px;
    font-size:11px;
}

.enter-btn{
    margin-top:40px;
    padding:14px 24px;
    border-radius:999px;
    background:white;
    color:#08090c;
    font-weight:700;
    box-shadow:0 20px 60px rgba(255,255,255,.1);
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){
    .sidebar{
        width:80px;
    }

    .logo-title,
    .logo-sub,
    .nav-label,
    .nav-group{
        display:none;
    }

    .main{
        margin-left:80px;
        width:calc(100% - 80px);
    }

    .grid-4{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .main{
        padding:20px 15px 30px;
    }

    .topbar{
        align-items:flex-start;
        padding-left:56px;
    }

    .page-title{
        font-size:24px;
    }

    .grid-4,
    .grid-3,
    .grid-2{
        grid-template-columns:1fr;

}
@media (max-width:430px){
  .main{padding-left:11px;padding-right:11px;}
  .topbar{gap:8px;}
  .topbar>div:first-child{padding-left:52px;}

  .topbar .btn.primary{font-size:11px;padding:8px 9px;}
  .invest-card{padding:13px;}
  .invest-head{grid-template-columns:1fr;}
  .invest-head>div:last-child{justify-content:flex-end;}
  .invest-value{font-size:22px;}
  .invest-mini{padding:9px 5px;}
  .invest-mini span{font-size:8px;}

}
@media (max-width:360px){
  .grid.grid-3{grid-template-columns:1fr;}
  .invest-grid{grid-template-columns:1fr 1fr;}
  .invest-grid .invest-mini:last-child{grid-column:1/-1;}
  .login-card{width:calc(100vw - 16px);padding:20px 14px;}
}

</head>

            <button type="button" class="btn danger" onclick="confirmPendingDelete()">確認刪除</button>
        </div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "trade_os_v4";

const defaultState = {

    currentCapital:0,

    strategies:[
        {
            id:"s1",
            name:"XAUUSD 1H 結構回踩",
            desc:"1H 結構 + Fibonacci + S/R",
            startingCapital:0
        },
        {
            id:"s2",
            name:"短線 SNR",
            desc:"支撐壓力短線交易",
            startingCapital:0
        }
    ],

    trades:[],

    goals:[
        {
            id:"g1",
            type:"money",
            name:"10,000 U",
            target:10000,
            image:""
        },
        {
            id:"g2",
            type:"money",
            name:"50,000 U",
            target:50000,
            image:""
        },
        {
            id:"g3",
            type:"money",
            name:"100,000 U",
            target:100000,
            image:""
        },
        {
            id:"g4",
            type:"dream",
            name:"Range Rover",
            target:100000,
            image:""
        },
        {
            id:"g5",
            type:"dream",
            name:"C63",
            target:80000,
            image:""
        }
    ],

    investments:[],
    capitalFlows:[],
    investmentFilter:"all"

};

let state = loadState();

let currentPage = "overview";
let activeStrategy = null;
let activeInvestment = null;

let calendarDate = new Date();


function loadState(){

    const saved = localStorage.getItem(STORAGE_KEY);

    if(!saved){
        return structuredClone(defaultState);
    }

    try{
        const merged = {
            ...structuredClone(defaultState),
            ...JSON.parse(saved)
        };
        merged.investments = (merged.investments||[]).map(normalizeInvestment);
        merged.capitalFlows = Array.isArray(merged.capitalFlows) ? merged.capitalFlows : [];
        merged.investmentFilter = merged.investmentFilter || "all";

        // v31: 清除舊版本殘留的測試交易一次。
        // 只在第一次開啟本版本時執行，之後新增的交易不會被清除。
        const TRADE_CLEANUP_KEY = "tradeos_v31_trade_cleanup";
        if(!localStorage.getItem(TRADE_CLEANUP_KEY)){
            merged.trades = [];
            localStorage.setItem(TRADE_CLEANUP_KEY, "1");
        }

        return merged;
    }catch{
        return structuredClone(defaultState);
    }
}


function saveState(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}


/* =========================================================
   HELPERS
========================================================= */

function money(v){
    return Number(v || 0).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " U";
}


function pct(v){
    return Number(v || 0).toFixed(2) + "%";
}


function uid(prefix="id"){
    return prefix + "_" + Date.now() + "_" +
        Math.random().toString(36).slice(2,8);
}


function toast(text){

    const el = document.getElementById("toast");

    el.textContent = text;
    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}


function pnlClass(v){
    return Number(v)>=0 ? "green" : "red";
}


function getStrategyTrades(strategyId){

    return state.trades.filter(
        t => t.strategyId === strategyId
    );
}

function getStrategyCapitalFlows(strategyId){
    return (state.capitalFlows||[]).filter(f=>f.strategyId===strategyId);
}

function getStrategyFlowNet(strategyId){
    return getStrategyCapitalFlows(strategyId)
        .reduce((sum,f)=>sum + (f.type==="deposit" ? Number(f.amount||0) : -Number(f.amount||0)),0);
}

function getStrategyCapital(strategy){
    const pnl = getStrategyTrades(strategy.id)
        .reduce((sum,t)=>sum+Number(t.pnl||0),0);
    return Number(strategy.startingCapital||0)+pnl+getStrategyFlowNet(strategy.id);
}

function getLongTermValue(){
    return state.investments.reduce(
        (sum,i)=>sum+Number(i.amount||0)+Number(i.pnl||0),0
    );
}

function getStrategiesCapital(){
    return state.strategies.reduce(
        (sum,s)=>sum+getStrategyCapital(s),0
    );
}

function getTotalAssets(){
    return getLongTermValue()+getStrategiesCapital();
}

function normalizeInvestment(i){
    return {
        ...i,
        category:["crypto","twstock","usstock"].includes(i.category) ? i.category : "usstock"
    };
}

function investmentCategoryLabel(c){
    return c==="crypto" ? "加密貨幣" : c==="twstock" ? "台股" : "美股";
}

function setInvestmentFilter(filter){
    state.investmentFilter=filter;
    render();
}


/* =========================================================
   APP NAVIGATION
========================================================= */

function enterApp(){
    const cover=document.getElementById("cover");
    const login=document.getElementById("loginScreen");

    // 正確流程：封面 → 登入頁 → 登入成功 → 科技轉場 → 主系統。
    cover?.classList.add("hide");
    login?.classList.remove("hidden");
    setTimeout(()=>document.getElementById("loginUsername")?.focus(),300);
}


function toggleMobileMenu(){
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('mobileMenuOverlay');
    const open = sidebar?.classList.toggle('mobile-open');
    overlay?.classList.toggle('show', !!open);
}

function closeMobileMenu(){
    document.querySelector('.sidebar')?.classList.remove('mobile-open');
    document.getElementById('mobileMenuOverlay')?.classList.remove('show');
}

function navigate(page,btn){

    currentPage = page;

    document.querySelectorAll(".nav-btn")
        .forEach(x=>x.classList.remove("active"));

    if(btn){
        btn.classList.add("active");
    }else{

        const map = {
            overview:0,
            strategies:1,
            goals:2,
            investments:3
        };

        const buttons =
            document.querySelectorAll(".nav-btn");

        if(buttons[map[page]]){
            buttons[map[page]]
                .classList.add("active");
        }

    }

    render();
    if(window.innerWidth <= 700){
        closeMobileMenu();
    }
}


function render(){

    const content =
        document.getElementById("content");

    if(currentPage==="overview"){
        content.innerHTML = overviewPage();
    }

    if(currentPage==="strategies"){
        content.innerHTML = strategiesPage();
    }

    if(currentPage==="goals"){
        content.innerHTML = goalsPage();
    }

    if(currentPage==="investments"){
        content.innerHTML = investmentsPage();

    }

    requestAnimationFrame(()=>{
        if(currentPage==="strategies"){
            renderEquityCurve();
        }

        if(currentPage==="investments" && !activeInvestment){
            renderInvestmentChart();
        }
    });
}


/* =========================================================
   OVERVIEW
========================================================= */

function overviewPage(){

    const totalPnl =
        state.trades.reduce(
            (sum,t)=>sum+Number(t.pnl||0),
            0
        );

    const win =
        state.trades.filter(t=>Number(t.pnl)>0).length;

    const loss =
        state.trades.filter(t=>Number(t.pnl)<0).length;

    const winRate =
        state.trades.length
        ? win/state.trades.length*100
        : 0;

    const currentValue = getLongTermValue();
    const totalAssets = getTotalAssets();

    return `

    <div class="topbar">

        <div>
            <div class="page-title">總覽</div>
            <div class="page-sub">
                你的交易、資金與長期資產
            </div>
        </div>

        <div class="top-actions">
            <button class="btn"
                onclick="openCapitalModal()">
                設定資金
            </button>
        </div>

    </div>

    <div class="grid grid-4">

        <div class="panel stat">
            <div class="stat-label">
                目前總資產
            </div>

            <div class="stat-value">
                ${money(totalAssets)}
            </div>

            
        </div>

        <div class="panel stat">
            <div class="stat-label">
                交易總損益
            </div>

            <div class="stat-value ${pnlClass(totalPnl)}">
                ${money(totalPnl)}
            </div>

            <div class="stat-small">
                ${state.trades.length} 筆交易
            </div>
        </div>

        <div class="panel stat">
            <div class="stat-label">
                勝率
            </div>

            <div class="stat-value">
                ${pct(winRate)}
            </div>

            <div class="stat-small">
                ${win} 勝 / ${loss} 負
            </div>
        </div>

        <div class="panel stat">
            <div class="stat-label">
                長線投資市值
            </div>

            <div class="stat-value">
                ${money(currentValue)}
            </div>

            <div class="stat-small">
                ${state.investments.length} 個投資項目
            </div>
        </div>

    </div>

    <div class="section">

        <div class="section-head">
            <div>
                <div class="section-title">
                    我的策略
                </div>

                <div class="section-sub">
                    選擇策略進入交易分析
                </div>
            </div>

            <button class="btn small"
                onclick="navigate('strategies')">
                管理策略
            </button>
        </div>

        <div class="grid grid-3">

            ${state.strategies.map(strategyCard).join("")}

        </div>

    </div>
<div class="section">

        <div class="grid grid-2">

            <div class="panel panel-pad">

                <div class="section-head">

                    <div>
                        <div class="section-title">
                            目標
                        </div>

                        <div class="section-sub">
                            距離下一個資金里程碑
                        </div>
                    </div>

                </div>

                ${goalMini()}

            </div>

            <div class="panel panel-pad">

                <div class="section-head">

                    <div>
                        <div class="section-title">
                            長線投資
                        </div>

                        <div class="section-sub">
                            Portfolio
                        </div>
                    </div>

                    <button class="btn small"
                        onclick="navigate('investments')">
                        查看
                    </button>

                </div>

                ${investmentMini()}

            </div>

        </div>

    </div>
    `;
}


function strategyCard(s){

    const ts = getStrategyTrades(s.id);

    const pnl =
        ts.reduce((a,t)=>a+Number(t.pnl||0),0);

    const wins =
        ts.filter(t=>Number(t.pnl)>0).length;

    const wr =
        ts.length ? wins/ts.length*100 : 0;

    return `

    <div class="panel strategy-card"
        onclick="openStrategy('${s.id}')">

        <div class="strategy-name">
            ${escapeHTML(s.name)}
        </div>

        <div class="strategy-desc">
            ${escapeHTML(s.desc||"")}
        </div>

        <div class="strategy-stats">

            <div class="mini-stat">
                <div class="mini-label">交易</div>
                <div class="mini-value">
                    ${ts.length}
                </div>
            </div>

            <div class="mini-stat">
                <div class="mini-label">勝率</div>
                <div class="mini-value">
                    ${pct(wr)}
                </div>
            </div>

            <div class="mini-stat">
                <div class="mini-label">損益</div>
                <div class="mini-value ${pnlClass(pnl)}">
                    ${money(pnl)}
                </div>
            </div>

        </div>

    </div>

    `;
}


function goalMini(){

    const sorted =
        [...state.goals]
        .filter(g=>g.target>0)
        .sort((a,b)=>a.target-b.target);

    const next =
        sorted.find(g=>getTotalAssets()<g.target)
        || sorted[sorted.length-1];

    if(!next){
        return "尚未設定目標";
    }

    const progress =
        Math.min(
            100,
            getTotalAssets() /
            next.target * 100
        );

    return `

        <div style="font-size:18px;font-weight:700;">
            ${escapeHTML(next.name)}
        </div>

        <div class="section-sub">
            ${money(getTotalAssets())}
            /
            ${money(next.target)}
        </div>

        <div class="progress">
            <div class="progress-head">
                <span>完成度</span>
                <span>${pct(progress)}</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill"
                     style="width:${progress}%">
                </div>
            </div>
        </div>
    `;
}


function investmentMini(){

    if(!state.investments.length){
        return `
        <div style="color:#737984;font-size:13px;padding:25px 0;">
            尚未新增長線投資
        </div>
        `;
    }

    return state.investments
        .slice(0,4)
        .map(i=>{

            const value =
                Number(i.amount||0)+
                Number(i.pnl||0);

            return `
            <div style="
                display:flex;
                justify-content:space-between;
                padding:13px 0;
                border-bottom:1px solid var(--line);
            ">

                <span>
                    ${escapeHTML(i.name)}
                </span>

                <span class="${pnlClass(i.pnl)}">
                    ${money(value)}
                </span>

            </div>
            `;

        }).join("");
}


/* =========================================================
   STRATEGIES PAGE
========================================================= */

function strategiesPage(){

    if(activeStrategy){

        return strategyDetailPage(activeStrategy);

    }

    return `

    <div class="topbar">

        <div>
            <div class="page-title">
                我的策略
            </div>

            <div class="page-sub">
                每一套策略獨立統計
            </div>
        </div>

        <button class="btn primary"
            onclick="openStrategyModal()">
            ＋ 新增策略
        </button>

    </div>

    <div class="grid grid-3">

        ${state.strategies.map(strategyManagerCard).join("")}

        <div class="panel strategy-card"
             onclick="openStrategyModal()"
             style="
                display:flex;
                align-items:center;
                justify-content:center;
                border-style:dashed;
             ">

            <div style="text-align:center;">
                <div style="font-size:28px;color:#666;">
                    ＋
                </div>

                <div style="margin-top:8px;color:#888;">
                    新增策略
                </div>
            </div>

        </div>

    </div>

    `;

}


function strategyManagerCard(s){

    const ts = getStrategyTrades(s.id);

    const pnl =
        ts.reduce((a,t)=>a+Number(t.pnl||0),0);

    const capital = getStrategyCapital(s);

    return `

    <div class="panel strategy-card"
        onclick="openStrategy('${s.id}')">

        <div class="strategy-name">
            ${escapeHTML(s.name)}
        </div>

        <div class="strategy-desc">
            ${escapeHTML(s.desc||"")}
        </div>

function strategyDailyCalendar(strategyId){
    const trades=getStrategyTrades(strategyId);
    const now=new Date();
    const year=calendarDate.getFullYear();
    const month=calendarDate.getMonth();
    const first=new Date(year,month,1);
    const last=new Date(year,month+1,0);
    const todayKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");

    const daily={};
    trades.forEach(t=>{
        const d=String(t.date||"").slice(0,10);
        if(!d)return;
        daily[d]=(daily[d]||0)+Number(t.pnl||0);
    });

    const todayPnl=Number(daily[todayKey]||0);
    const monthPnl=Object.entries(daily).reduce((sum,[d,p])=>{
        const x=new Date(d+"T00:00:00");
        return x.getFullYear()===year && x.getMonth()===month ? sum+p : sum;
    },0);

    let cells="";
    for(let i=0;i<first.getDay();i++) cells+='<div class="day empty"></div>';
    for(let day=1;day<=last.getDate();day++){
        const key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
        const pnl=Number(daily[key]||0);
        const cls=pnl>0?'green':pnl<0?'red':'';
        cells+=`<div class="day ${key===todayKey?'today':''}">
            <div class="day-num">${day}</div>
            <div class="day-pnl ${cls}">${pnl===0?'—':money(pnl)}</div>
        </div>`;
    }

    return `
    <div class="section">
        <div class="panel panel-pad">
            <div class="section-head">
                <div>
                    <div class="section-title">每日損益</div>
                    <div class="section-sub">${year} 年 ${month+1} 月交易損益日曆</div>
                </div>
                <div style="text-align:right">
                    <div style="font-size:10px;color:#666c76">今日損益</div>
                    <div class="mini-value ${pnlClass(todayPnl)}" style="font-size:20px">${money(todayPnl)}</div>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:4px">
                ${["日","一","二","三","四","五","六"].map(x=>`<div class="calendar-head">${x}</div>`).join("")}
            </div>
            <div class="calendar">${cells}</div>
            <div style="margin-top:14px;text-align:right;color:#777;font-size:11px">本月累計 ${money(monthPnl)}</div>
        </div>
    </div>`;
}

/* =========================================================
   STATISTICS
========================================================= */

function calculateStats(trades){

    const pnl =
        trades.map(t=>Number(t.pnl||0));

    const total = pnl.length;

    if(!total){

        return {
            total:0,
            wins:0,
            losses:0,
            winRate:0,
            avgWin:0,
            avgLoss:0,
            expectancy:0,
            ciLow:0,
            ciHigh:0,
            profitFactor:0,
            maxDrawdown:0,
            maxLosingStreak:0
        };

    }

    const wins =
        pnl.filter(x=>x>0);

    const losses =
        pnl.filter(x=>x<0);

    const winRate =
        wins.length/total;

    const avgWin =
        wins.length
        ? wins.reduce((a,b)=>a+b,0)/wins.length
        : 0;

    const avgLoss =
        losses.length
        ? Math.abs(
            losses.reduce((a,b)=>a+b,0)
            /losses.length
        )
        : 0;

    /*
        EXPECTANCY

        E =
        勝率 × 平均獲利
        -
        敗率 × 平均虧損
    */

    const expectancy =
        winRate*avgWin
        -
        (1-winRate)*avgLoss;

    /*
        95% CONFIDENCE INTERVAL

        使用交易 P&L 樣本
        標準誤 = SD / sqrt(n)
        CI = mean ± 1.96 * SE
    */

    const mean =
        pnl.reduce((a,b)=>a+b,0)/total;

    const variance =
        pnl.reduce(
            (sum,x)=>sum+Math.pow(x-mean,2),
            0
        ) / Math.max(total-1,1);

    const sd = Math.sqrt(variance);

    const se =
        sd / Math.sqrt(total);

    const ciLow =
        mean - 1.96*se;

    const ciHigh =
        mean + 1.96*se;

    /*
        PROFIT FACTOR
    */

    const grossWin =
        wins.reduce((a,b)=>a+b,0);

    const grossLoss =
        Math.abs(
            losses.reduce((a,b)=>a+b,0)
        );

    const profitFactor =
        grossLoss
        ? grossWin/grossLoss
        : wins.length ? Infinity : 0;

    /*
        MAX DRAWDOWN
    */

    let equity=0;
    let peak=0;
    let maxDD=0;

    [...trades]
        .sort(
            (a,b)=>
                new Date(a.date)-new Date(b.date)
        )
        .forEach(t=>{

            equity += Number(t.pnl||0);

            peak =
                Math.max(peak,equity);

            const dd =
                peak-equity;

            maxDD =
                Math.max(maxDD,dd);

        });

    /*
        LOSING STREAK
    */

    let currentLoss=0;
    let maxLosingStreak=0;

    pnl.forEach(x=>{

        if(x<0){
            currentLoss++;
            maxLosingStreak =
                Math.max(
                    maxLosingStreak,
                    currentLoss
                );
        }else{
            currentLoss=0;
        }

    });

    return {
        total,
        wins:wins.length,
        losses:losses.length,
        winRate:winRate*100,
        avgWin,
        avgLoss,
        expectancy,
        ciLow,
        ciHigh,
        profitFactor,
        maxDrawdown:maxDD,
        maxLosingStreak
    };

}

/* =========================================================
   EQUITY CURVE
========================================================= */

function renderEquityCurve(){

    const chart =
        document.getElementById("equityChart");

    if(!chart)return;

    const id =
        chart.dataset.strategy;

    const strategy =
        state.strategies.find(s=>s.id===id);

    const trades =
        getStrategyTrades(id)
        .sort(
            (a,b)=>
                new Date(a.date)-new Date(b.date)
        );

    const flows = getStrategyCapitalFlows(id)
        .slice()
        .sort((a,b)=>new Date(a.date)-new Date(b.date));

    if(!trades.length && !flows.length){

        chart.innerHTML = `
            <div class="chart-empty">
                尚無交易資料
            </div>
        `;

        return;
    }

    let equity =
        Number(strategy.startingCapital||0);

    const values =
        [equity];

    const events = [
        ...trades.map(t=>({date:t.date,delta:Number(t.pnl||0)})),
        ...flows.map(f=>({date:f.date,delta:f.type==="deposit"?Number(f.amount||0):-Number(f.amount||0)}))
    ].sort((a,b)=>new Date(a.date)-new Date(b.date));

    events.forEach(e=>{
        equity += e.delta;
        values.push(equity);
    });

    const width=1000;
    const height=280;

    const min =
        Math.min(...values);

    const max =
        Math.max(...values);

    const range =
        max-min || 1;

    const points =
        values.map((v,i)=>{

            const x =
                i/(values.length-1)*width;

            const y =
                height -
                ((v-min)/range)*(height-30)
                -15;

            return [x,y];

        });

    const path =
        points.map(
            (p,i)=>
                `${i?"L":"M"} ${p[0]} ${p[1]}`
        ).join(" ");

    const area =
        `${path} L ${width} ${height} L 0 ${height} Z`;

    chart.innerHTML = `

    <svg viewBox="0 0 ${width} ${height}"
         preserveAspectRatio="none">

        <defs>

            <linearGradient
                id="equityGradient"
                x1="0"
                x2="0"
                y1="0"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#60a5fa"
                    stop-opacity=".24"/>

                <stop
                    offset="100%"
                    stop-color="#60a5fa"
                    stop-opacity="0"/>

            </linearGradient>

        </defs>

        <line
            class="chart-grid"
            x1="0"
            y1="70"
            x2="${width}"
            y2="70"/>

        <line
            class="chart-grid"
            x1="0"
            y1="140"
            x2="${width}"
            y2="140"/>

        <line
            class="chart-grid"
            x1="0"
            y1="210"
            x2="${width}"
            y2="210"/>

        <path
            class="equity-area"
            d="${area}"/>

        <path
            class="equity-line"
            d="${path}"/>

    </svg>

    <div style="
        display:flex;
        justify-content:space-between;
        color:#656b75;
        font-size:10px;
        margin-top:5px;
    ">

        <span>交易 0</span>

        <span>
            ${trades.length} 筆
        </span>

    </div>

    `;

}

function renderInvestmentChart(){
    const chart = document.getElementById("investmentChart");
    if(!chart) return;

    const investments = (state.investments || [])
        .map(normalizeInvestment)
        .slice()
        .sort((a,b)=>String(a.date||a.createdAt||"").localeCompare(String(b.date||b.createdAt||"")));

    if(!investments.length){
        chart.innerHTML = `<div class="chart-empty">尚無長線投資資料</div>`;
        return;
    }

    // Keep ONE curve only: the combined value of all long-term investments.
    let total = 0;
    const values = [0];
    const labels = [""];

    investments.forEach(i=>{
        total += Number(i.amount||0) + Number(i.pnl||0);
        values.push(total);
        labels.push(i.date || i.createdAt || "");
    });

    const width = 1000;
    const height = 280;
    const padding = 18;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;

    const points = values.map((v,i)=>{
        const x = i/(values.length-1)*width;
        const y = height - ((v-min)/range)*(height-30) - 15;
        return [x,y];
    });

    const path = points.map((p,i)=>`${i?"L":"M"} ${p[0]} ${p[1]}`).join(" ");
    const area = `${path} L ${width} ${height} L 0 ${height} Z`;

    chart.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
        <defs>
            <linearGradient id="investmentGradient" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#60a5fa" stop-opacity=".24"/>
                <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <line class="chart-grid" x1="0" y1="70" x2="${width}" y2="70"/>
        <line class="chart-grid" x1="0" y1="140" x2="${width}" y2="140"/>
        <line class="chart-grid" x1="0" y1="210" x2="${width}" y2="210"/>
        <path d="${area}" fill="url(#investmentGradient)"/>
        <path class="equity-line" d="${path}"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;opacity:.42;margin-top:4px">
        <span>${escapeHTML(labels[1] || labels[0] || "")}</span>
        <span>${escapeHTML(labels.at(-1) || "")}</span>
    </div>`;
}

/* TWD -> USD conversion for Taiwan stocks */
const DEFAULT_USD_TWD_RATE=31.50;
async function fetchUsdTwdRate(){
 try{const response=await fetch("https://api.frankfurter.app/latest?from=USD&to=TWD",{cache:"no-store"});if(!response.ok)throw new Error("FX request failed");const data=await response.json();const rate=Number(data?.rates?.TWD);if(!Number.isFinite(rate)||rate<=0)throw new Error("Invalid FX rate");return rate;}
 catch(error){console.warn("FX rate unavailable, using fallback rate:",error);return DEFAULT_USD_TWD_RATE;}
}
function updateInvestmentAmountUI(){const category=document.getElementById("investCategory")?.dataset.value||"usstock";const label=document.getElementById("investAmountLabel");const pnlLabel=document.getElementById("investPnlLabel");const input=document.getElementById("investAmount");const pnlInput=document.getElementById("investPnl");if(!input)return;if(label)label.textContent=category==="twstock"?"投入金額（TWD）":"投入金額（USD）";if(pnlLabel)pnlLabel.textContent=category==="twstock"?"目前損益（TWD）":"目前損益（USD）";input.placeholder=category==="twstock"?"例如：100000":"例如：3000";if(pnlInput)pnlInput.placeholder=category==="twstock"?"例如：5000":"例如：150";}
async function updateInvestmentFxPreview(){const category=document.getElementById("investCategory")?.dataset.value||"usstock";const input=document.getElementById("investAmount");const preview=document.getElementById("investFxPreview");const pnlInput=document.getElementById("investPnl");const pnlPreview=document.getElementById("investPnlFxPreview");if(!input||!preview)return;if(category!=="twstock"){preview.textContent="系統以 USD 儲存";if(pnlPreview)pnlPreview.textContent="損益以 USD 儲存";return;}const twd=Number(input.value||0);const pnlTwd=Number(pnlInput?.value||0);if(!twd&&!pnlTwd){preview.textContent="台股輸入新台幣，儲存時自動換算 USD";if(pnlPreview)pnlPreview.textContent="台股損益輸入新台幣，儲存時自動換算 USD";return;}preview.textContent="正在取得最新匯率…";const rate=await fetchUsdTwdRate();preview.textContent=twd?`約 ${money(twd/rate)} USD（1 USD ≈ ${rate.toFixed(3)} TWD）`:"投入金額尚未輸入";if(pnlPreview)pnlPreview.textContent=pnlTwd?`損益約 ${money(pnlTwd/rate)} USD（1 USD ≈ ${rate.toFixed(3)} TWD）`:"損益尚未輸入";}

async function saveInvestment(id){

    const name =
        document.getElementById(
            "investName"
        ).value.trim();

    const symbol =
        document.getElementById(
            "investSymbol"
        ).value.trim();

    const category =
        document.getElementById("investCategory")
            .dataset.value || "usstock";

    const enteredAmount =
        Number(
            document.getElementById(
                "investAmount"
            ).value
        );

    if(!Number.isFinite(enteredAmount) || enteredAmount < 0){
        toast("請輸入有效的投入金額");
        return;
    }

    const rate = category === "twstock" ? await fetchUsdTwdRate() : 1;
    const amount = category === "twstock" ? enteredAmount / rate : enteredAmount;

    const enteredPnl =
        Number(
            document.getElementById(
                "investPnl"
            ).value
        );
    const pnl = category === "twstock" ? enteredPnl / rate : enteredPnl;

    const date =
        document.getElementById(
            "investDate"
        ).value;

    if(!name){

        toast("請輸入投資名稱");
        return;

    }

    if(id){

        const i =
            state.investments.find(
                x=>x.id===id
            );

        i.name=name;
        i.symbol=symbol;
        i.category=category;
        i.amount=amount;
        i.amountTwd=category === "twstock" ? enteredAmount : null;
        i.fxRate=category === "twstock" ? rate : null;
        i.pnl=pnl;
        i.pnlTwd=category === "twstock" ? enteredPnl : null;
        i.date=date;
        i.updatedAt=new Date().toISOString().slice(0,10);
        i.history=Array.isArray(i.history)?i.history:[];
        i.history.push({date:i.updatedAt,value:amount+pnl});

    }else{

        state.investments.push({

            id:uid("investment"),

            name,
            symbol,
            category,
            amount,
            amountTwd:category === "twstock" ? enteredAmount : null,
            fxRate:category === "twstock" ? rate : null,
            pnl,
            pnlTwd:category === "twstock" ? enteredPnl : null,
            date,
            updatedAt:date,
            history:[{date,value:amount+pnl}]

        });

    }

    saveState();
    closeModal();
    render();

    toast(id?"投資已修改":"投資已新增");

}


function confirmDeleteInvestment(){
    const id = pendingDeleteId;
    if(pendingDeleteType !== "investment" || !id) return closeDeleteConfirm();

}

========================================================= */

function uploadGoalImage(goalId){

    const input =
        document.createElement("input");

    input.type="file";
    input.accept="image/*";

    input.onchange=()=>{

        const file=input.files[0];

        if(!file)return;

        const reader =
            new FileReader();

        reader.onload=e=>{

            const g =
                state.goals.find(
                    x=>x.id===goalId
                );

            if(g){

                const img = new Image();
                img.onload = ()=>{
                    const max=1800;
                    const scale=Math.min(1,max/Math.max(img.width,img.height));
                    const canvas=document.createElement("canvas");
                    canvas.width=Math.round(img.width*scale);
                    canvas.height=Math.round(img.height*scale);
                    const ctx=canvas.getContext("2d");
                    ctx.drawImage(img,0,0,canvas.width,canvas.height);
                    g.image=canvas.toDataURL("image/jpeg",.86);
                    saveState();
                    render();
                };
                img.src=e.target.result;

            }

        };

        reader.readAsDataURL(file);

    };

    input.click();

}

function escapeHTML(str){

    return String(str??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(str){
    return escapeHTML(str);
}

async function handleLogin(event){
    event.preventDefault();
    const email=document.getElementById("loginUsername").value.trim();
    const password=document.getElementById("loginPassword").value;
    const error=document.getElementById("loginError");
    const screen=document.getElementById("loginScreen");
    const button=document.querySelector(".login-button");

    if(!supabaseClient){
        error.textContent="登入系統載入失敗，請重新整理頁面後再試";
        error.classList.add("show");
        return;

    if(button){button.disabled=true;button.textContent="登入中...";}

    try{
        const {data,error:authError}=await supabaseClient.auth.signInWithPassword({email,password});
        if(authError){
            console.error("Supabase login error:",authError);
            error.textContent=authError.message==="Invalid login credentials"
                ? "Email 或密碼錯誤"
                : "登入失敗，請確認網路或帳號設定";
            error.classList.add("show");
            document.getElementById("loginPassword")?.select();
            if(button){button.disabled=false;button.textContent="登入";}
            return;
        }
        window.tradeOSSession=data.session;
        screen?.classList.add("hidden");
        if(typeof startSciFiTransition === "function") startSciFiTransition();
        else { document.getElementById("cover")?.classList.add("hide"); navigate("overview"); }
    }catch(e){
        console.error("Supabase login exception:",e);
        error.textContent="登入失敗，請重新整理頁面後再試";
        error.classList.add("show");
        if(button){button.disabled=false;button.textContent="登入";}

<script>
/* Sci-Fi transition controller */
let sciFiTransitionStarted = false;
function startSciFiTransition(){
  const overlay = document.getElementById("sciFiTransition");
  if(!overlay || sciFiTransitionStarted) return;
  sciFiTransitionStarted = true;

  const bar = document.getElementById("sfProgressBar");
  const status = document.getElementById("sfStatusText");
  const code = document.getElementById("sfCode");
  const stages = [
    ["BOOTING CORE","BOOT // 010"],
    ["BUILDING DATA FIELD","FIELD // 027"],
    ["CALIBRATING SIGNALS","SIGNAL // 043"],
    ["MAPPING CAPITAL","MAP // 069"],
    ["ACCESS GRANTED","READY // 101"]
  ];

  overlay.classList.remove("is-hidden");
  overlay.classList.add("is-active");
  let p = 0;
  const start = performance.now();

  function tick(now){
    const elapsed = now - start;
    p = Math.min(100, elapsed / 2100 * 100);
    if(bar) bar.style.width = p + "%";
    const idx = Math.min(stages.length - 1, Math.floor(p / 20));
    if(status) status.textContent = stages[idx][0];
    if(code) code.textContent = stages[idx][1];

    if(p < 100){
      requestAnimationFrame(tick);
    }else{
      setTimeout(()=>{
        overlay.classList.remove("is-active");
        overlay.classList.add("is-hidden");

        // Login success must go directly into the app.
        // Never show the cover again, otherwise the user would have to
        // press「進入系統」a second time.
        document.getElementById("cover")?.classList.add("hide");
        document.getElementById("loginScreen")?.classList.add("hidden");
        navigate("overview");
      }, 260);
    }
  }
  requestAnimationFrame(tick);
}
</script>
